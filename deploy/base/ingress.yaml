apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fluxsum-ingress
  namespace: fluxsum
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: fluxsum.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fluxsum-main
                port:
                  number: 80
