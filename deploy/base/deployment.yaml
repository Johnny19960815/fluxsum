apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxsum-main
  namespace: fluxsum
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluxsum-main
  template:
    metadata:
      labels:
        app: fluxsum-main
    spec:
      containers:
        - name: main
          image: fluxsum/main:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
