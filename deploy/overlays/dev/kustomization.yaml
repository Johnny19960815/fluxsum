apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fluxsum-dev

resources:
  - ../../base

namePrefix: dev-

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: fluxsum-main

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.fluxsum.example.com
    target:
      kind: Ingress
      name: fluxsum-ingress
