apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fluxsum-staging

resources:
  - ../../base

namePrefix: staging-

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: fluxsum-main

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.fluxsum.example.com
    target:
      kind: Ingress
      name: fluxsum-ingress
