apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fluxsum-prod

resources:
  - ../../base

namePrefix: prod-

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: fluxsum-main

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
    target:
      kind: Deployment
      name: fluxsum-main

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: fluxsum.example.com
    target:
      kind: Ingress
      name: fluxsum-ingress
