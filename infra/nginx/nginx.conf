upstream hub_central {
    server hub-central-server:8080;
}

upstream ai_platform_web {
    server ai-platform-web:3000;
}

upstream fixbuy_admin {
    server fixbuy-admin:3001;
}

upstream aifoot_web {
    server aifoot-web:3002;
}

upstream aifoot_engine {
    server aifoot-engine:8001;
}

server {
    listen 80;
    server_name antf.io;

    # MF Host 主应用
    location / {
        proxy_pass http://ai_platform_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # SSO API
    location /sso/ {
        proxy_pass http://hub_central/sso/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin API
    location /admin/ {
        proxy_pass http://hub_central/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# MF Remote - fixbuy-admin
server {
    listen 80;
    server_name admin.antf.io;

    location / {
        proxy_pass http://fixbuy_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # MF manifest 路由
    location /mf-manifest.json {
        proxy_pass http://fixbuy_admin/mf-manifest.json;
        add_header Access-Control-Allow-Origin *;
    }
}

# MF Remote - aifoot-web
server {
    listen 80;
    server_name aifoot.antf.io;

    location / {
        proxy_pass http://aifoot_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # MF manifest 路由
    location /mf-manifest.json {
        proxy_pass http://aifoot_web/mf-manifest.json;
        add_header Access-Control-Allow-Origin *;
    }
}

# AIFoot Engine API
server {
    listen 80;
    server_name api.aifoot.antf.io;

    location / {
        proxy_pass http://aifoot_engine;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
