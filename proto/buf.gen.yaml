version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/fluxsum/api/gen
plugins:
  - plugin: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - plugin: buf.build/connectrpc/go
    out: gen/go
    opt: paths=source_relative
  - plugin: buf.build/bufbuild/es
    out: ../packages/api-sdk/src/generated
    opt: target=ts
  - plugin: buf.build/connectrpc/es
    out: ../packages/api-sdk/src/generated
    opt: target=ts
