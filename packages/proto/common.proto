syntax = "proto3";

package fluxsum.common;

option go_package = "github.com/fluxsum/proto/common";

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  int64 total = 3;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Error {
  int32 code = 1;
  string message = 2;
  map<string, string> details = 3;
}

message Empty {}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
  STATUS_PENDING = 3;
  STATUS_DELETED = 4;
}
